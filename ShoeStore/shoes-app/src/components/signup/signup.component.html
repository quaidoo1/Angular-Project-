<div class="auth-page">
  <div class="form-container">
    <div class="form-header">
      <h1 class="form-title">Create account</h1>
          </div>

    <div *ngIf="error" class="alert-error">
      {{ error }}
    </div>

    <form (ngSubmit)="signup()" #signupForm="ngForm" class="auth-form" novalidate>
      <div class="field-group">
        <label class="field-label" for="username">Username</label>
        <input
          id="username"
          class="auth-input"
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="johndoe"
          required
        />
      </div>

      <div class="field-group">
        <label class="field-label" for="email">Email address</label>
        <input
          id="email"
          class="auth-input"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="field-group">
        <label class="field-label" for="password">Password</label>
        <div class="input-wrap">
          <input
            id="password"
            class="auth-input"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="Minimum 6 characters"
            required
          />
          <button type="button" class="eye-btn" (click)="togglePassword()">
            <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          class="auth-input"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Repeat your password"
          required
        />
      </div>

      <button type="submit" class="auth-btn" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login" class="auth-link">Sign in</a></p>
    </div>
  </div>
</div>
