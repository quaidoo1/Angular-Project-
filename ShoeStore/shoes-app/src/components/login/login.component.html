<div class="auth-page">
  <div class="auth-split">
    <!-- Left brand panel -->
    <div class="brand-panel">
      <div class="brand-content">
        <div class="brand-logo">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <path d="M4 26L10 14L20 20L30 8L36 18" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="36" cy="18" r="3" fill="white"/>
          </svg>
        </div>
        <h2 class="brand-name">ShoesStore</h2>
        <p class="brand-tagline">Step into style. Every pair, a story.</p>
        <div class="brand-features">
          <div class="feature">
            <span class="feature-icon">✦</span>
            <span>Curated premium collection</span>
          </div>
          <div class="feature">
            <span class="feature-icon">✦</span>
            <span>Secure JWT-protected account</span>
          </div>
          <div class="feature">
            <span class="feature-icon">✦</span>
            <span>Manage your entire inventory</span>
          </div>
        </div>
      </div>
      <div class="brand-glow"></div>
    </div>

    <!-- Right form panel -->
    <div class="form-panel">
      <div class="form-container">
        <div class="form-header">
          <h1 class="form-title">Welcome back</h1>
          <p class="form-subtitle">Sign in to your account to continue</p>
        </div>

        <div *ngIf="error" class="alert-error">
          <span class="alert-icon">⚠</span> {{ error }}
        </div>

        <form (ngSubmit)="login()" #loginForm="ngForm" class="auth-form" novalidate>
          <div class="field-group">
            <label class="field-label" for="email">Email address</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                  <polyline points="22,6 12,13 2,6"/>
                </svg>
              </span>
              <input
                id="email"
                class="auth-input"
                type="email"
                [(ngModel)]="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
              />
            </div>
          </div>

          <div class="field-group">
            <label class="field-label" for="password">Password</label>
            <div class="input-wrap">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                id="password"
                class="auth-input"
                [type]="showPassword ? 'text' : 'password'"
                [(ngModel)]="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <button type="button" class="eye-btn" (click)="togglePassword()">
                <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg *ngIf="showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="auth-btn" [disabled]="loading">
            <span *ngIf="!loading">Sign in</span>
            <span *ngIf="loading" class="btn-loading">
              <span class="spinner"></span> Signing in...
            </span>
          </button>
        </form>

        <div class="auth-footer">
          <p>Don't have an account? <a routerLink="/signup" class="auth-link">Create one</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
